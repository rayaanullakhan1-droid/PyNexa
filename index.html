 h2,.page h1{margin:0}.page h1{font-size:34px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--brand);font-size:11px;font-weight:800}.lesson{min-height:145px}.lesson h3{margin:9px 0 4px}.progress{height:9px;background:var(--line);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:230px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text)}.lesson-layout{display:grid;grid-template-columns:235px 1fr;gap:15px}.lessonnav{display:grid;gap:5px;align-content:start}.lessonnav button{padding:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;text-align:left}.lessonnav button.active{color:var(--brand);border-color:var(--brand);background:var(--soft)}.article{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:25px}.code{background:#0b1020;color:#e5e7eb;border-radius:13px;padding:16px;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow:auto}.editorgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.editor{width:100%;min-height:390px;background:#090e1c;color:#e6edf7;border:0;border-radius:13px;padding:17px;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;tab-size:4;outline:none}.output{min-height:390px;background:#090e1c;color:#b8f7d2;border-radius:13px;padding:17px;font:13px/1.65 ui-monospace,monospace;white-space:pre-wrap;overflow:auto}.status{padding:8px 11px;border-radius:9px;background:var(--soft);color:var(--brand);font-size:12px;font-weight:750}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:13px}.li /* Pynexa premium learning cards */
.learning-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}
.skill-card{position:relative;overflow:hidden;min-height:190px;padding:22px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--soft) 45%,var(--panel)));box-shadow:0 10px 30px #1018280b;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.skill-card:before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--brand),var(--brand2));opacity:.85}
.skill-card:after{content:'🐍';position:absolute;right:-8px;bottom:-18px;font-size:82px;opacity:.045;transform:rotate(-12deg);pointer-events:none}
.skill-card:hover{transform:translateY(-5px);box-shadow:0 18px 42px #10182818;border-color:#8b5cf655}
.skill-top{display:flex;align-items:center;justify-content:space-between;gap:10px}

.skill-card h3{font-size:18px;margin:15px 0 5px}

.skill-open{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:12px;padding:10px 13px}
.category-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.program-card{position:relative;padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel),var(--surface2));transition:.2s}.program-card:hover{transform:translateY(-3px);box-shadow:0 16px 35px #10182812}.file-icon{width:42px;height:48px;border-radius:10px;background:linear-gradient(145deg,var(--soft),var(--panel));border:1px solid var(--line);display:grid;place-items:center;font-size:20px}.program-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.program-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.dots{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:10px}.program-menu{position:absolute;right:16px;top:58px;z-index:5;min-width:145px;padding:6px;border:1px solid var(--line);background:var(--panel);border-radius:13px;box-shadow:0 18px 40px #0002;display:none}.program-menu.open{display:grid}.program-menu button{border:0;background:none;text-align:left;padding:9px;border-radius:8px;color:var(--text)}.program-menu button:hover{background:var(--soft);color:var(--accent)}
.practice-card{padding:20px;border:1px solid var(--line);border-radius:19px;background:var(--panel);transition:.2s}.practice-card:hover{transform:translateY(-3px);box-shadow:0 15px 34px #10182812}.xp-chip{padding:5px 8px;border-radius:999px;background:#fef3c7;color:#92400e;font-weight:850;font-size:10px}.dark .xp-chip{background:#422d06;color:#fbbf24}.hint{padding:12px;border-radius:12px;background:var(--soft);color:var(--muted);margin-top:12px}.testcase{padding:11px;border:1px dashed var(--line);border-radius:12px;font-family:ui-monospace,monospace}.success-pop{animation:successPop .5s ease}
.quiz-progress{height:7px;background:var(--line);border-radius:99px;overflow:hidden}.quiz-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .4s}.quiz-option{display:flex;align-items:center;gap:11px}.quiz-letter{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--soft);font-weight:850;color:var(--accent)}
.chart{display:grid;gap:14px}.chart-row{display:grid;grid-template-columns:100px 1fr 45px;align-items:center;gap:10px}.chart-bar{height:11px;border-radius:99px;background:var(--line);overflow:hidden}.chart-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;animation:grow .8s ease}.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.badge-card{text-align:center;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.badge-card .emoji{font-size:30px;filter:grayscale(1);opacity:.35}.badge-card.unlocked .emoji{filter:none;opacity:1;animation:float .8s ease}.badge-card.unlocked{border-color:#f59e0b55;background:linear-gradient(145deg,var(--panel),#f59e0b0b)}

function lessonInfo(name){const examples={Introduction:['Python is a high-level programming language designed for readable code and rapid development.','print("Hello, Pynexa!")'],Syntax:['Python uses indentation to define blocks. Consistent indentation keeps code clear.','if True:\n    print("Python is awesome")'],Variables:['Variables are names bound to values. Python infers their type automatically.','name = "Pynexa"\nscore = 100\nprint(name, score)'],Conditions:['Use if, elif and else to make decisions.','score = 75\nif score >= 50:\n    print("Pass")\nelse:\n    print("Try again")'],Loops:['for and while repeat work. A for loop is commonly used with range().','for i in range(3):\n    print(i)'],Lists:['Lists are ordered, mutable collections.','fruits = ["apple", "banana"]\nfruits.append("mango")\nprint(fruits)'],Functions:['Functions package reusable behavior.','def greet(name):\n    return "Hello " + name\nprint(greet("Alex"))'],OOP:['Classes define objects with attributes and behavior.','class Student:\n    def __init__(self, name):\n        self.name = name\ns = Student("Alex")\nprint(s.name)']};return examples[name]||[`Explore ${name} with examples and practice. Use the editor below to experiment.`,`# Try ${name}\nprint("Pynexa")`]}
function openLesson(name){const [ex,code]=lessonInfo(name);document.getElementById('view').innerHTML=`<div class="page"><button class="ghost" id="backToLessons">← Back to Learn Python</button><div class="article" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div><span class="pill">Python lesson</span><h1 style="margin:8px 0">${esc(name)}</h1></div><span class="status">${store.lessons[name]?'Completed ✓':'In progress'}</span></div><h3>Explanation</h3><p>${esc(ex)}</p><h3>Syntax & Example</h3><div class="code">${esc(code)}</div><h3>Try It Yourself</h3><textarea id="lessonCode" class="editor" style="min-height:300px">${esc(code)}</textarea><div class="toolbar"><button class="btn primary" id="lessonRun">▶ Run Code</button><button class="ghost" id="lessonSave">Save Notes</button><button class="ghost" id="lessonComplete">${store.lessons[name]?'Completed ✓':'Mark Complete'}</button></div><div id="lessonOut" class="output" style="min-height:150px">Output will appear here.</div><h3>Important notes</h3><p class="muted">Experiment with small changes, read errors carefully, and practice without copying every line.</p><h3>Common mistakes</h3><p class="muted">Watch indentation, spelling, brackets and variable names.</p><textarea id="lessonNote" class="search" style="width:100%;min-height:100px" placeholder="Save a note for this lesson…">${esc(store.notes[name]||'')}</textarea></div></div>`;document.getElementById('backToLessons').addEventListener('click',learn);document.getElementById('lessonRun').addEventListener('click',()=>runEditor('lessonCode','lessonOut'));document.getElementById('lessonSave').addEventListener('click',()=>saveLessonNote(name));document.getElementById('lessonComplete').addEventListener('click',()=>markLesson(name))}
function markLesson(n){store.lessons[n]=Date.now();saveStore();toast('Lesson marked complete ✓');openLesson(n)}function saveLessonNote(n){const id='note_'+btoa(n).replace(/=/g,'');const el=document.getElementById(id);if(el){store.notes[n]=el.value;saveStore();toast('Note saved')}}

function write(){document.getElementById('view').innerHTML=`<div class="page"><h1>Write Python</h1><p class="muted">Run Python directly in your browser with Pyodide. Large files are kept as one editor string and are not recursively re-rendered.</p><div class="toolbar"><span id="pyStatus" class="status">Python runtime: not loaded</span><button class="btn primary" onclick="runEditor('mainEditor','mainOut')">▶ Run</button><button class="ghost" onclick="stopPython()">■ Stop</button><button class="ghost" onclick="clearEditor()">Clear</button><button class="ghost" onclick="copyEditor()">Copy</button><button class="ghost" onclick="saveMainProgram()">Save</button><button class="ghost" onclick="downloadEditor()">Download .py</button><label class="ghost">Upload .py <input hidden type="file" accept=".py,text/x-python" onchange="uploadEditor(event)"></label></div><div class="editorgrid"><textarea id="mainEditor" class="editor" spellcheck="false">${esc(editorCode)}</textarea><div><div class="toolbar" style="margin:0 0 8px"><button class="ghost" onclick="copyOutput('mainOut')">Copy Output</button></div><pre id="mainOut" class="output">Ready. Ctrl+Enter to run.</pre></div></div><div class="toolbar"><input id="programName" class="search" value="${esc(currentProgram)}" style="max-width:260px"><span id="fileInfo" class="muted">No file loaded</span></div></div>`;const e=document.getElementById('mainEditor');e.addEventListener('keydown',editorKey);}
function editorKey(e){if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();runEditor('mainEditor','mainOut')}if(e.key==='Tab'){e.preventDefault();const s=e.target.selectionStart;e.target.value=e.target.value.slice(0,s)+'    '+e.target.value.slice(e.target.selectionEnd);e.target.selectionStart=e.target.selectionEnd=s+4}}
function clearEditor(){const e=document.getElementById('mainEditor');if(e)e.value=''}async function copyOutput(id){const o=document.getElementById(id);if(!o){toast('Output panel not found');return}const text=o.innerText||o.textContent||'';if(!text.trim()){toast('Nothing to copy');return}try{if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){await navigator.clipboard.writeText(text);toast('Output copied ✓');return}}catch(e){}const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.left='-9999px';t.style.top='0';t.style.width='1px';t.style.height='1px';document.body.appendChild(t);const selection=document.getSelection();const range=document.createRange();t.focus();t.select();t.setSelectionRange(0,t.value.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}if(selection){try{selection.removeAllRanges();selection.addRange(range)}catch(e){}}t.remove();if(ok)toast('Output copied ✓');else toast('Copy is blocked by this preview browser. Download or use Ctrl+C from the output.')}function copyEditor(){navigator.clipboard?.writeText(document.getElementById('mainEditor').value);toast('Code copied')}function downloadEditor(){const code=document.getElementById('mainEditor').value;const input=document.getElementById('programName');const n=(input&&input.value||'program').trim().replace(/\.py$/i,'')+'.py';if(code.length>2e6){toast('File is too large for localStorage; download only');}else{const existing=store.programs[n];store.programs[n]={id:n,name:n,code,created:existing?.created||Date.now(),modified:Date.now()};saveStore();currentProgram=n;toast('Saved locally ✓');}const blob=new Blob([code],{type:'text/x-python;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=n;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function uploadEditor(ev){const f=ev.target.files&&ev.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const e=document.getElementById('mainEditor');if(e)e.value=String(reader.result);currentProgram=f.name;const n=document.getElementById('programName');if(n)n.value=f.name;document.getElementById('fileInfo').textContent=`Loaded: ${f.name} · ${f.size.toLocaleString()} bytes`;toast('Python file loaded')};reader.onerror=()=>toast('Could not read file');reader.readAsText(f);ev.target.value=''}

function programs(){const arr=Object.values(store.programs);document.getElementById('view').innerHTML=`<div class="page"><h1>My Programs</h1><p class="muted">Programs are stored locally in this browser. Full code is loaded only when you open a program.</p><div class="toolbar"><input class="search" placeholder="Search programs…" oninput="filterPrograms(this.value)"><button class="btn primary" onclick="newProgram()">＋ New Program</button></div><div id="programList" class="list">${arr.length?arr.map(p=>programRow(p)).join(''):'<div class="card">No saved programs yet. Open Write Python and click Save.</div>'}</div></div>`}
function programRow(p){const key=encodeURIComponent(p.name);return `<div class="item program-row" data-name="${esc(p.name.toLowerCase())}"><div><b>${esc(p.name)}</b><div class="muted">Modified ${new Date(p.modified).toLocaleString()} · ${(p.code.length/1024).toFixed(1)} KB</div></div><div class="toolbar" style="margin:0"><button class="ghost program-action" data-action="open" data-key="${esc(key)}">Open</button><button class="ghost program-action" data-action="rename" data-key="${esc(key)}">Rename</button><button class="ghost program-action" data-action="download" data-key="${esc(key)}">Download</button><button class="ghost program-action danger" data-action="delete" data-key="${esc(key)}">Delete</button></div></div>`}
function filterPrograms(v){document.querySelectorAll('.program-row').forEach(x=>x.style.display=x.dataset.name.includes(v.toLowerCase())?'flex':'none')}document.addEventListener('click',function(e){const b=e.target.closest('.program-action');if(!b)return;e.preventDefault();e.stopPropagation();const n=decodeProgramKey(b.dataset.key||'');try{if(b.dataset.action==='open')openProgram(n);else if(b.dataset.action==='rename')renameProgram(n);else if(b.dataset.action==='download')downloadProgram(n);else if(b.dataset.action==='delete')deleteProgram(n);}catch(err){console.error(err);toast('Could not complete that program action.');}});function decodeProgramKey(k){try{return decodeURIComponent(k)}catch(e){return ''}}function openProgramKey(k){openProgram(decodeProgramKey(k))}function renameProgramKey(k){renameProgram(decodeProgramKey(k))}function downloadProgramKey(k){downloadProgram(decodeProgramKey(k))}function deleteProgramKey(k){deleteProgram(decodeProgramKey(k))}function newProgram(){currentProgram='program.py';editorCode='';go('Write Python')}function openProgram(n){if(typeof n!=='string')return;const p=store.programs[n];if(!p){toast('Program not found');return;}editorCode=p.code;currentProgram=p.name;go('Write Python');setTimeout(()=>{document.getElementById('programName').value=p.name;document.getElementById('fileInfo').textContent=`Opened: ${p.name}`},0)}function showProgramDialog(type,n){const p=store.programs[n];if(!p){toast('Program not found');return}let modal=document.getElementById('programModal');if(!modal){modal=document.createElement('div');modal.id='programModal';modal.style.cssText='position:fixed;inset:0;background:#10182888;display:grid;place-items:center;z-index:200;padding:20px';document.body.appendChild(modal)}if(type==='rename'){modal.innerHTML=`<div class="card" style="width:min(430px,100%);box-shadow:0 20px 60px #0003"><h2 style="margin-top:0">Rename program</h2><p class="muted">Choose a new filename.</p><input id="renameInput" class="search" style="width:100%;min-width:0" value="${esc(p.name)}" maxlength=200><div class="toolbar"><button class="btn primary" id="renameConfirm">Rename</button><button class="ghost" id="renameCancel">Cancel</button></div></div>`;modal.style.display='grid';document.getElementById('renameConfirm').onclick=()=>{const raw=document.getElementById('renameInput').value.trim();if(!raw){toast('Enter a program name');return}let nn=raw.replace(/[^a-zA-Z0-9._ -]/g,'_');if(!/\.py$/i.test(nn))nn+='.py';if(nn===n){modal.remove();return}if(store.programs[nn]){toast('A program with that name already exists');return}const copy={...p,name:nn,id:nn,modified:Date.now()};store.programs[nn]=copy;delete store.programs[n];saveStore();if(currentProgram===n)currentProgram=nn;modal.remove();programs();toast('Program renamed ✓')};document.getElementById('renameCancel').onclick=()=>modal.remove();document.getElementById('renameInput').focus();document.getElementById('renameInput').select()}else if(type==='delete'){modal.innerHTML=`<div class="card" style="width:min(430px,100%);box-shadow:0 20px 60px #0003"><h2 style="margin-top:0">Delete program?</h2><p>Delete <b>${esc(p.name)}</b> permanently from this browser?</p><div class="toolbar"><button class="btn" style="background:var(--danger);color:white" id="deleteConfirm">Delete</button><button class="ghost" id="deleteCancel">Cancel</button></div></div>`;modal.style.display='grid';document.getElementById('deleteConfirm').onclick=()=>{delete store.programs[n];saveStore();if(currentProgram===n){currentProgram='program.py';editorCode=''}modal.remove();programs();toast('Program deleted ✓')};document.getElementById('deleteCancel').onclick=()=>modal.remove()}}function renameProgram(n){showProgramDialog('rename',n)}function deleteProgram(n){showProgramDialog('delete',n)}function downloadProgram(n){if(typeof n!=='string')return;const p=store.programs[n];if(!p){toast('Program not found');return}try{const blob=new Blob([p.code],{type:'text/x-python;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=p.name||'program.py';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Download started ✓')}catch(err){console.error(err);toast('Could not download this program')}}
function runEditor(id,outId){const code=document.getElementById(id)?.value||'';const out=document.getElementById(outId);if(!out)return;if(code.length>2e6){out.textContent='Execution blocked: code exceeds the preview safety limit (2 MB).';return}stopPython();out.textContent='Preparing Python environment…';const status=document.getElementById('pyStatus');if(status)status.textContent='Python runtime: starting…';runWorker=new Worker(URL.createObjectURL(new Blob([`let py=null;self.onmessage=async e=>{if(e.data.type!=='run')return;try{if(!py){importScripts('https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js');py=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/'});}py.setStdout({batched:s=>postMessage({type:'out',s})});py.setStderr({batched:s=>postMessage({type:'err',s})});postMessage({type:'ready'});await py.runPythonAsync(e.data.code);postMessage({type:'done'});}catch(err){postMessage({type:'error',s:String(err)})}}`],{type:'application/javascript'})));let output='';runWorker.onmessage=e=>{if(e.data.type==='out'){if(output.length<50000)output+=e.data.s+'\n';out.textContent=output.slice(0,50000)+(output.length>50000?'\n…output truncated at 50,000 characters…':'')}else if(e.data.type==='err'){output+=e.data.s+'\n';out.textContent=output.slice(0,50000)}else if(e.data.type==='ready'){if(status)status.textContent='Python Ready ✓'}else if(e.data.type==='done'){if(!output)out.textContent='✓ Code ran successfully.';clearTimeout(runTimer);runWorker.terminate();runWorker=null}else if(e.data.type==='error'){out.textContent='Python error:\n'+e.data.s;clearTimeout(runTimer);runWorker.terminate();runWorker=null;if(status)status.textContent='Python Ready ✓'}};runTimer=setTimeout(()=>{if(runWorker){runWorker.terminate();runWorker=null;out.textContent='Execution stopped because it exceeded the 8-second limit.';if(status)status.textContent='Python runtime: ready after restart';}},8000);runWorker.postMessage({type:'run',code})}

    document.querySelectorAll('[data-prog-action]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const n=decodeURIComponent(b.dataset.progKey);const a=b.dataset.progAction;if(a==='open')openProgram(n);if(a==='rename')renameProgram(n);if(a==='download')downloadProgram(n);if(a==='delete')deleteProgram(n)}));
  }
  window.programs=programsPremium;
  function practicePremium(){document.getElementById('view').innerHTML=`<div class="page"><div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap"><div><h1>Practice Arena</h1><p class="muted">Solve, test and earn XP. Every completed challenge moves your level forward.</p></div><span class="status">✨ ${xp()} XP</span></div><div class="grid">${PRACTICE.map((q,i)=>{const done=!!store.practice[i],d=i<5?'Easy':i<11?'Medium':'Hard',pts=i<5?25:i<11?40:60;return `<div class="practice-card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="difficulty ${d==='Easy'?'easy':d==='Medium'?'medium':'hard'}">${d}</span><span class="xp-chip">+${pts} XP</span></div><h3 style="margin-bottom:7px">Challenge ${i+1}</h3><p class="muted">${esc2(q[1])}</p><div class="testcase">🧪 Test: produce the expected result</div><div class="toolbar"><button class="btn primary" onclick="practiceOpen(${i})">${done?'Review':'Start'} Challenge →</button></div>${done?'<p class="muted success-pop">✓ Completed</p>':'<div class="hint">💡 Hint available inside the challenge.</div>'}</div>`}).join('')}</div></div>`}
  window.practicePage=practicePremium;
  function quizzesPremium(){const q=QUIZ[qi];const selected=answers[qi];const pct=Math.round(qi/QUIZ.length*100);document.getElementById('view').innerHTML=`<div class="page"><div style="display:flex;justify-content:space-between;align-items:end;gap:12px"><div><h1>Python Quiz</h1><p class="muted">Test your knowledge and build your score history.</p></div><span class="status">⏱ ${Math.max(0,30-(qi*2))}s</span></div><div class="article" style="margin-top:16px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:8px"><span>Question ${qi+1} of ${QUIZ.length}</span><b>${pct}%</b></div><div class="quiz-progress"><i style="width:${pct}%"></i></div><h2 style="margin-top:24px">${esc2(q[0])}</h2><div class="options">${q[1].map((o,i)=>`<button class="option quiz-option ${selected===i?'selected':''}" onclick="answers[${qi}]=${i};quizzes()"><span class="quiz-letter">${String.fromCharCode(65+i)}</span>${esc2(o)}</button>`).join('')}</div>${selected!==undefined?`<div class="feature-card" style="margin-top:16px"><b>${selected===q[2]?'🎉 Correct!':'💡 Not quite'}</b><p class="muted">${esc2(q[3])}</p></div>`:''}<div class="toolbar"><button class="ghost" onclick="quizPrev()">← Previous</button><button class="btn primary" onclick="quizNext()">${qi===QUIZ.length-1?'Finish Quiz':'Next Question →'}</button><button class="ghost" onclick="answers={};qi=0;quizzes()">Retry</button></div></div><div class="section card"><h3>Quiz history</h3><p class="muted">${store.scores.length?`${store.scores.length} answers recorded locally. Current accuracy: ${Math.round(store.scores.reduce((a,b)=>a+b,0)/store.scores.length*100)}%.`:'No quiz history yet — take your first quiz.'}</p></div></div>`}
  window.quizzes=quizzesPremium;
  function progressPremium(){const l=Object.keys(store.lessons).length,p=Object.keys(store.practice).length,q=store.scores.length?Math.round(store.scores.reduce((a,b)=>a+b,0)/store.scores.length*100):0;const overall=Math.round((l/LESSONS.length*45+p/PRACTICE.length*30+q/100*25));const badges=[['🌱','First Lesson',l>=1],['🔥','3 Day Streak',daysStreak()>=3],['🧩','5 Challenges',p>=5],['🧠','Quiz Master',q>=80],['🚀','10 Lessons',l>=10],['💻','First Program',Object.keys(store.programs).length>=1],['🏆','Level 5',level()>=5],['🐍','Python Pro',overall>=90]];document.getElementById('view').innerHTML=`<div class="page"><h1>Progress</h1><p class="muted">Your learning journey, XP, achievements and performance — all stored locally.</p><div class="grid"><div class="card"><span class="muted">Overall</span><h2>${overall}%</h2><div class="progress"><i style="width:${overall}%"></i></div></div><div class="card"><span class="muted">Lessons</span><h2>${l}/${LESSONS.length}</h2><div class="progress"><i style="width:${l/LESSONS.length*100}%"></i></div></div><div class="card"><span class="muted">Practice</span><h2>${p}/${PRACTICE.length}</h2><div class="progress"><i style="width:${p/PRACTICE.length*100}%"></i></div></div><div class="card"><span class="muted">XP / Level</span><h2>${xp()} / ${level()}</h2><div class="xpbar"><i style="width:${Math.min(100,(xp()%250)/250*100)}%"></i></div></div></div><div class="section card"><h2>Performance</h2><div class="chart"><div class="chart-row"><span>Learning</span><div class="chart-bar"><i style="width:${l/LESSONS.length*100}%"></i></div><b>${Math.round(l/LESSONS.length*100)}%</b></div><div class="chart-row"><span>Practice</span><div class="chart-bar"><i style="width:${p/PRACTICE.length*100}%"></i></div><b>${Math.round(p/PRACTICE.length*100)}%</b></div><div class="chart-row"><span>Quiz</span><div class="chart-bar"><i style="width:${q}%"></i></div><b>${q}%</b></div></div></div><div class="section"><h2>Achievements</h2><div class="badge-grid">${badges.map(b=>`<div class="badge-card ${b[2]?'unlocked':''}"><div class="emoji">${b[0]}</div><b>${b[1]}</b><p class="muted" style="font-size:11px">${b[2]?'Unlocked':'Locked'}</p></div>`).join('')}</div></div><div class="section card"><h3>About Pynexa</h3><p>Pynexa is a Python learning and practice platform created to help students learn Python through lessons, coding, hands-on practice, quizzes and projects.</p><p><b>Developed by Rayaan Ulla Khan</b></p></div><footer class="footer">© 2026 Pynexa — Learn Python. Level Up.<br>Developed by Rayaan Ulla Khan 💻</footer></div>`}
  window.progress=progressPremium;
  /* bottom navigation + global search */
  const bottom=document.createElement('div');bottom.className='bottom-nav';bottom.innerHTML=[['Home','home'],['Learn Python','book'],['Write Python','code'],['Practice','practice'],['Progress','progress']].map(x=>`<button data-bottom="${x[0]}"><div class="bottom-icon">${ICON_SVG[x[1]]}</div>${x[0].replace(' Python','')}</button>`).join('');document.body.appendChild(bottom);bottom.addEventListener('click',e=>{const b=e.target.closest('[data-bottom]');if(b)go(b.dataset.bottom)});
  const top=document.querySelector('.topright');if(top){const wrap=document.createElement('div');wrap.style='position:relative';wrap.className='top-search';wrap.innerHTML='<input id="globalSearch" class="search global-search" placeholder="Search Pynexa…"><div id="searchResults" class="search-results"></div>';top.prepend(wrap);const input=wrap.querySelector('#globalSearch'),results=wrap.querySelector('#searchResults');const all=[...LESSONS.map(x=>['Lesson',x,()=>openLesson(x)]),...PRACTICE.map((x,i)=>['Practice',x[1],()=>practiceOpen(i)]),...PROJECTS.map((x,i)=>['Project',x[0],()=>projectOpen(i)]),...REF.map(x=>['Reference',x,()=>go('Reference')])];input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase();if(!q){results.classList.remove('open');return}const hit=all.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q)).slice(0,7);results.innerHTML=hit.length?hit.map((x,i)=>`<div class="search-result" data-r="${i}"><small class="muted">${x[0]}</small><br><b>${esc2(x[1])}</b></div>`).join(''):'<div class="search-result muted">No results found.</div>';results.classList.add('open');results.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{hit[+b.dataset.r][2]();results.classList.remove('open');input.value=''}))});document.addEventListener('click',e=>{if(!wrap.contains(e.target))results.classList.remove('open')})}
  touchActivity();homePremium();
})();
</script></body></html>
